# TV Clean: build the debug APK on every push to main (and by hand).
# The APK is debug-signed, so it installs straight on a phone with no signing key.
# GitHub runners already have the Android SDK; JDK 21 matches the project's toolchain.
# Checkout fetches the submodule too (third_party/cleanyourtv) — the build needs it.
# The push carries text files only, so the workflow first downloads the 17 binary
# files the build needs (scripts/fetch-binary-assets.sh, hash-verified against
# the pinned upstream commit).
# The full-flavour APK is also posted to a rolling "debug" GitHub Release, so it
# can be downloaded without signing in.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch binary assets (hash-verified)
        run: bash scripts/fetch-binary-assets.sh

      - name: Build debug APK
        run: sh ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tv-clean-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 30

      - name: Post the full-flavour APK to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debug >/dev/null 2>&1 || gh release create debug --title "TV Clean debug build" --notes "Latest debug build from main. Test build only — install straight on a phone."
          gh release upload debug app/build/outputs/apk/full/debug/app-full-debug.apk --clobber
